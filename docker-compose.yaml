services:
  postgres:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    container_name: ${POSTGRES_CONTAINER_NAME:-postgres}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: ${POSTGRES_INITDB_ARGS:--encoding=UTF8 --locale=C}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:${POSTGRES_DATA_PATH:-/var/lib/postgresql}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - postgres_network

  # Database browser for local development: http://localhost:5050
  pgadmin:
    image: dpage/pgadmin4:9.18.0@sha256:c332c5f6dfba995d9ebc4af261d93506d6876085d712eaaa3defc8dd1a3f26de
    container_name: ${PGADMIN_CONTAINER_NAME:-pgadmin}
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    configs:
      - source: pgadmin_servers
        target: /pgadmin4/servers.json
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - postgres_network

  # Catches every email the app sends in development and shows it at http://localhost:8025.
  # Nothing is delivered to real inboxes.
  mailpit:
    image: axllent/mailpit:v1.31.3@sha256:ed9b00c609e77e99c79b93f1178255ebc271868920f2c69a8d166bd5634ed10d
    container_name: ${MAILPIT_CONTAINER_NAME:-mailpit}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"

# Registers the database in pgAdmin on first start, so only its password has to be typed.
configs:
  pgadmin_servers:
    content: |
      {"Servers": {"1": {"Name": "Mailbridge", "Group": "Servers", "Host": "postgres", "Port": 5432,
        "MaintenanceDB": "${POSTGRES_DB}", "Username": "${POSTGRES_USER}", "SSLMode": "prefer"}}}

volumes:
  postgres_data:
    driver: local
    name: ${POSTGRES_VOLUME_NAME:-postgres_data}
  pgadmin_data:
    driver: local
    name: ${PGADMIN_VOLUME_NAME:-pgadmin_data}

networks:
  postgres_network:
    driver: bridge
    name: ${POSTGRES_NETWORK_NAME:-postgres_network}