<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Sign in · Company Mail Portal</title>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/login.css">
  <script src="js/login.js" defer></script>
</head>
<body>
  <main class="login-page">
    <div class="login-shell">
      <p class="ribbon"><span aria-hidden="true"></span>SYSTEMS OPERATIONAL · GATEWAY ACTIVE</p>
      <section class="login-card" aria-labelledby="login-title">
        <div class="card-content">
          <header class="card-header">
            <a class="brand" href="index.html" aria-label="Company Mail Portal home">
              <img src="assets/images/company-mail-logo.png" width="137" height="42" alt="Company Mail — Internal Ticketing">
            </a>
            <h1 id="login-title">Company Mail Portal</h1>
            <p>Sign in with your company account to access<br class="desktop-break"> the internal ticketing queue.</p>
          </header>

          <div id="error-banner" class="error-banner" role="alert" tabindex="-1" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2 21h20L12 3Z"/><path d="M12 9v5m0 3v.2"/></svg>
            <div><h2 id="error-title">Unable to sign in</h2><p id="error-message"></p></div>
          </div>

          <form id="login-form" action="/auth/login" method="post">
            <div class="field">
              <label for="email">Corporate email</label>
              <div class="input-wrap">
                <span class="at-icon" aria-hidden="true">@</span>
                <input id="email" name="email" type="email" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="employee@company.com" required>
              </div>
            </div>
            <div class="field">
              <label for="password">Password</label>
              <div class="input-wrap">
                <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 5v2"/></svg>
                <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required>
                <button id="toggle-password" class="password-toggle" type="button" aria-label="Show password" aria-controls="password" aria-pressed="false">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path id="eye-slash" d="m3 3 18 18" hidden/></svg>
                </button>
              </div>
            </div>
            <button id="login-button" class="login-button" type="submit">
              <span id="button-label">Log in</span>
              <svg id="button-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15m-6-6 6 6-6 6"/></svg>
              <span id="button-spinner" class="spinner" aria-hidden="true" hidden></span>
            </button>
            <p id="login-status" class="sr-only" role="status"></p>
          </form>
          <noscript><p class="noscript">Enable JavaScript to sign in to this portal.</p></noscript>
        </div>
        <footer class="card-footer">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 7 3v6c0 4-3 7-7 9-4-2-7-5-7-9V6l7-3Z"/><path d="m8 12 3 3 5-6"/></svg>
          <span>Company accounts only · Internal mail portal</span>
        </footer>
      </section>
      <p class="page-footer">Need access? Contact your IT manager.</p>
    </div>
  </main>
</body>
</html>
