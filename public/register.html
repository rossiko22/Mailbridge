<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Create account · Mailbridge</title>
    <link rel="icon" href="assets/logo-dark.svg" type="image/svg+xml">
    <script src="js/theme.js"></script>
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/auth.css">
    <script src="js/core.js" defer></script>
    <script src="js/auth.js" defer></script>
  </head>
  <body data-public>
    <main class="auth">
      <section class="auth__card" aria-labelledby="title">
        <div class="auth__head">
          <h1 class="auth__title" id="title">Create account</h1>
          <p class="muted">Then connect your Outlook and Gmail mailboxes</p>
        </div>
        <div id="form-message" class="banner banner--error" role="alert" tabindex="-1" hidden></div>
        <form class="auth__form" data-auth="register" novalidate>
          <div class="field">
            <label class="label" for="name">Name <span class="muted">(optional)</span></label>
            <input class="input" id="name" name="displayName" type="text" autocomplete="name" maxlength="80">
          </div>
          <div class="field">
            <label class="label" for="email">Email</label>
            <input
              class="input"
              id="email"
              name="email"
              type="email"
              autocomplete="username"
              autocapitalize="none"
              spellcheck="false"
              maxlength="254"
              required
            >
          </div>
          <div class="field">
            <label class="label" for="password">Password</label>
            <div class="input-group">
              <input
                class="input"
                id="password"
                name="password"
                type="password"
                autocomplete="new-password"
                minlength="12"
                maxlength="1024"
                required
                aria-describedby="password-help"
              >
              <button type="button" class="icon-btn" data-toggle-password aria-label="Show password" aria-pressed="false"></button>
            </div>
            <p class="help" id="password-help">At least 12 characters.</p>
          </div>
          <div class="field">
            <label class="label" for="confirm">Confirm password</label>
            <input class="input" id="confirm" name="confirm" type="password" autocomplete="new-password" maxlength="1024" required>
          </div>
          <button class="btn btn--primary btn--lg btn--block" type="submit">Create account</button>
        </form>
        <div class="auth__links">
          <span class="muted">Already have an account?</span>
          <a href="index.html">Sign in</a>
        </div>
      </section>
    </main>
  </body>
</html>
