# Render Blueprint (free plan). In the Render dashboard: New > Blueprint, then pick this repository.
# Optional settings (OAuth apps, SMTP, ALLOW_REGISTRATION) are added afterwards under the service's Environment tab;
# see .env.production.example for the names.
databases:
  - name: mailbridge-db
    plan: free
    region: frankfurt
    databaseName: ticket_mail
    user: ticket_mail
    # Reachable only from services in this Render account, over the private network.
    ipAllowList: []

services:
  - type: web
    name: mailbridge
    runtime: docker
    plan: free
    region: frankfurt
    # The free plan has no pre-deploy step, so migrations run on every start.
    # npm is not in the runtime image; the same two steps as "npm run start:render".
    # Render passes everything after -c to the shell as one string, so no quotes around it
    # (quotes would make the whole line a single command name: "not found", exit 127).
    dockerCommand: /bin/sh -c node dist/scripts/migrate.js && node dist/server.js
    healthCheckPath: /health
    # Deploy a push to main only after every GitHub check on that commit is green.
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      # PUBLIC_ORIGIN falls back to the onrender.com address. Set it here once a custom domain is attached.
      - key: SESSION_SECRET
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: POSTGRES_HOST
        fromDatabase:
          name: mailbridge-db
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: mailbridge-db
          property: port
      - key: POSTGRES_DB
        fromDatabase:
          name: mailbridge-db
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: mailbridge-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: mailbridge-db
          property: password
